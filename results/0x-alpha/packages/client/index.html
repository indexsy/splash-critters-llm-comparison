<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splash Critters</title>
    <style>
      :root {
        --bg: #1a1c2c;
        --panel: #29366f;
        --ink: #f4f4f4;
        --accent: #ffcd75;
        --water: #41a6f6;
        --danger: #b13e53;
        --ok: #38b764;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "Courier New", ui-monospace, monospace;
        font-weight: bold;
        overflow: hidden;
      }
      body { display: flex; align-items: center; justify-content: center; }
      #app { width: min(100vw, 960px); height: min(100vh, 720px); position: relative; }
      canvas#game {
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: none;
      }
      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      h1 { font-size: 42px; letter-spacing: 2px; color: var(--accent); text-shadow: 3px 3px 0 var(--panel); }
      h2 { font-size: 22px; color: var(--accent); }
      .subtitle { color: var(--water); font-size: 14px; }
      button {
        font-family: inherit;
        font-weight: bold;
        font-size: 15px;
        background: var(--panel);
        color: var(--ink);
        border: 3px solid var(--ink);
        box-shadow: 0 4px 0 #000;
        padding: 10px 18px;
        cursor: pointer;
        min-width: 260px;
      }
      button:hover { background: #3b4a8c; }
      button:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
      button.primary { background: var(--ok); color: #06131a; }
      button.danger { background: var(--danger); }
      button.small { min-width: 0; padding: 6px 10px; font-size: 12px; }
      input, select {
        font-family: inherit;
        font-weight: bold;
        font-size: 15px;
        background: #0b0d1a;
        color: var(--ink);
        border: 3px solid var(--panel);
        padding: 8px 10px;
        width: 280px;
      }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
      .col { display: flex; flex-direction: column; gap: 10px; align-items: center; }
      .panel {
        background: rgba(11, 13, 26, 0.85);
        border: 3px solid var(--panel);
        padding: 16px;
        max-width: 720px;
        max-height: 80vh;
        overflow-y: auto;
      }
      table { border-collapse: collapse; width: 100%; font-size: 13px; }
      th, td { border-bottom: 2px solid var(--panel); padding: 5px 8px; text-align: left; }
      th { color: var(--accent); }
      .tag { color: var(--water); }
      .muted { color: #7b8bbd; font-size: 12px; }
      .hidden { display: none !important; }
      #hud {
        position: absolute; inset: 0; pointer-events: none;
        display: none; font-size: 13px;
      }
      #hud .players { position: absolute; top: 8px; left: 8px; display: flex; gap: 8px; }
      #hud .pcard { background: rgba(11,13,26,.8); border: 2px solid var(--panel); padding: 4px 8px; }
      #hud .feed { position: absolute; top: 8px; right: 8px; text-align: right; max-width: 300px; }
      #hud .announce {
        position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
        font-size: 34px; color: var(--accent); text-shadow: 3px 3px 0 #000;
      }
      #hud .timer { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 18px; }
      .xpbar { width: 280px; height: 18px; border: 3px solid var(--ink); background: #0b0d1a; }
      .xpbar > div { height: 100%; background: var(--ok); transition: width .8s ease; }
      .badge { display:inline-block; background:var(--panel); border:2px solid var(--accent); color:var(--accent); padding:2px 8px; font-size:12px; }
      a { color: var(--water); }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="256" height="224"></canvas>
      <div id="hud"></div>
      <div id="screens"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
