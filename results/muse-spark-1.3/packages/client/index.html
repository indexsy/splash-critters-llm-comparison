<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Splash Critters — 8-bit Water Balloon Battler</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0b1020; color: #eaf2ff; font-family: 'Courier New', monospace; }
  #app { max-width: 960px; margin: 0 auto; padding: 12px; }
  .card { background: #141b33; border: 4px solid #2b3a67; border-radius: 8px; padding: 16px; margin: 12px 0; box-shadow: 0 4px 0 #000; }
  h1.logo { font-size: 40px; text-align: center; color: #5df2ff; text-shadow: 3px 3px 0 #1a5f7a, 6px 6px 0 #000; letter-spacing: 2px; margin: 8px 0; }
  .sub { text-align: center; color: #9fb3d9; margin-bottom: 8px; }
  button { font-family: inherit; font-weight: bold; background: #2fbf71; color: #06210f; border: 0; border-bottom: 4px solid #1a7a47; border-radius: 6px; padding: 10px 14px; margin: 4px; cursor: pointer; font-size: 15px; }
  button.secondary { background: #3a4a7a; color: #fff; border-bottom-color: #232c4e; }
  button.warn { background: #e4572e; color: #fff; border-bottom-color: #93300f; }
  button:disabled { opacity: 0.5; cursor: default; }
  input, select { font-family: inherit; padding: 8px; border-radius: 6px; border: 2px solid #2b3a67; background: #0e1430; color: #fff; margin: 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #gameCanvas { width: 100%; image-rendering: pixelated; background: #000; border: 4px solid #2b3a67; border-radius: 8px; }
  .hud { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .hud .p { background: #0e1430; border: 2px solid #2b3a67; border-radius: 6px; padding: 6px 8px; font-size: 12px; min-width: 150px; }
  .feed { background: #0e1430; border: 2px solid #2b3a67; border-radius: 6px; padding: 6px; height: 90px; overflow: hidden; font-size: 12px; }
  .announce { text-align: center; font-size: 22px; color: #ffd23f; text-shadow: 2px 2px 0 #000; min-height: 30px; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid #2b3a67; padding: 6px; text-align: left; }
  .tier { display: inline-block; padding: 2px 6px; border-radius: 4px; background: #3a4a7a; font-size: 11px; }
  a { color: #5df2ff; }
  .small { font-size: 12px; color: #9fb3d9; }
  canvas.pixel { image-rendering: pixelated; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
